name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest

    steps:
      # The three actions below run on node24 from these majors on, which asks
      # for runner 2.327.1 or newer; hosted `ubuntu-latest` has it. checkout's
      # v7 break concerns `pull_request_target` and `workflow_run` only, and
      # this workflow triggers on neither.
      - name: Checkout
        uses: actions/checkout@v7

      # Reads the pnpm version from the `packageManager` field of package.json.
      # `devDependencies.pnpm` declares it a second time, for local installs;
      # `packages/engine/tests/repoManifest.test.ts` asserts the two agree, so
      # the pin behaves as if it lived in one place. v6 is the major for pnpm
      # 10 — `pnpm/setup` is the pnpm 11+ successor, not a replacement here.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      # Node 20 cannot run this project: the client's jsdom suite pulls in
      # undici, which requires >=22.19.0, and jsdom 30 itself asks for
      # ^22.22.2 || ^24.15.0 || >=26. On 20 the suite fails to load at all.
      # `cache: pnpm` is still an explicit opt-in on v7 and still needs pnpm
      # on the PATH first, which is why this step follows the one above.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test
